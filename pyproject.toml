[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "models", "scripts", "__pycache__"]

[tool.ruff.lint]
# High-signal rules to start. E501 (line length) is off because the legacy
# UI code embeds long HTML/CSS strings; the formatter governs new code.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py must call st.set_page_config()/inject theme before importing page
# modules — a required Streamlit ordering, so late imports are intentional.
"app.py" = ["E402"]
